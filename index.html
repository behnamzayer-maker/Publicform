<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ATH Wellness & Movement Assessment | اندیشه طلوع حرکت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --jade:#0C4A3F;
    --jade-2:#12645480;
    --jade-light:#1E7A63;
    --gold:#D4AF37;
    --gold-soft:#F0D68C;
    --gold-dim:#8A7127;
    --navy-light:#2C4C6E;
    --navy-deep:#1A3350;
    --cream:#F4EFE3;
    --cream-dim:#C9C2B1;
    --ink:#0E1B16;
    --danger:#B3583F;
    --radius:22px;
    --shadow-lg:0 30px 80px -20px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    color:var(--cream);
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(212,175,55,.16), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(30,122,99,.35), transparent 55%),
      linear-gradient(160deg, var(--navy-deep) 0%, #223f5c 42%, var(--jade) 100%);
    overflow-x:hidden;
    position:relative;
  }
  @media (prefers-reduced-motion: no-preference){
    .drift{ animation: drift 22s ease-in-out infinite; }
    .drift2{ animation: drift2 26s ease-in-out infinite; }
  }
  @keyframes drift{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-24px,30px)} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(26px,-22px)} }

  .bg-orb{position:fixed; border-radius:50%; filter:blur(70px); pointer-events:none; z-index:0; opacity:.55;}
  .orb1{width:420px;height:420px; background:radial-gradient(circle, rgba(212,175,55,.35), transparent 70%); top:-120px; right:-100px;}
  .orb2{width:520px;height:520px; background:radial-gradient(circle, rgba(30,122,99,.4), transparent 70%); bottom:-160px; left:-140px;}

  .particle{position:fixed; width:4px; height:4px; border-radius:50%; background:var(--gold-soft); opacity:.35; pointer-events:none; z-index:0;}

  .app{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:28px 18px 60px; min-height:100vh; display:flex; flex-direction:column;}

  /* header */
  .brandbar{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:4px;}
  .brandbar img{width:104px; height:104px; object-fit:contain; filter:drop-shadow(0 8px 22px rgba(212,175,55,.35)); transition:transform .6s ease, filter .6s ease;}
  .brandbar.hero img{width:172px; height:172px; filter:drop-shadow(0 14px 34px rgba(212,175,55,.5));}
  .brand-text{ text-align:center; margin-bottom:4px; }
  .brand-text b{display:block; font-weight:800; font-size:16px; letter-spacing:.3px; color:var(--gold-soft); line-height:1.6;}

  .progress-wrap{margin:22px 0 8px; position:relative;}
  .progress-label{display:flex; justify-content:space-between; font-size:12px; color:var(--cream-dim); margin-bottom:8px;}
  .progress-track{height:6px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; position:relative;}
  .progress-fill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--jade-light), var(--gold)); box-shadow:0 0 16px rgba(212,175,55,.55); transition:width .6s cubic-bezier(.65,0,.35,1);}

  .stage{flex:1; display:flex; flex-direction:column; justify-content:center; padding:18px 0;}

  .card{
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:var(--radius);
    padding:30px 24px;
    box-shadow:var(--shadow-lg);
    animation:cardIn .55s cubic-bezier(.22,1,.36,1);
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(18px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }

  .eyebrow{display:inline-block; font-size:12px; color:var(--gold-soft); background:rgba(212,175,55,.12); border:1px solid rgba(212,175,55,.35); padding:4px 12px; border-radius:20px; margin-bottom:14px;}
  h1.q{font-size:22px; line-height:1.6; margin:0 0 6px; font-weight:700; color:var(--cream);}
  p.sub{font-size:13.5px; color:var(--cream-dim); margin:0 0 22px; line-height:1.8;}

  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:14px 16px; cursor:pointer; text-align:right;
    transition:all .25s ease; font-size:14.5px; color:var(--cream);
  }
  .opt:hover{background:rgba(212,175,55,.09); border-color:rgba(212,175,55,.4); transform:translateX(-2px);}
  .opt.selected{background:linear-gradient(90deg, rgba(212,175,55,.22), rgba(30,122,99,.22)); border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .opt .dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--cream-dim); flex-shrink:0; position:relative; transition:border-color .2s;}
  .opt.selected .dot{border-color:var(--gold);}
  .opt.selected .dot::after{content:''; position:absolute; inset:3px; border-radius:50%; background:var(--gold);}

  .opt.multi .checkbox{width:18px; height:18px; border-radius:5px; border:2px solid var(--cream-dim); flex-shrink:0; position:relative; transition:border-color .2s;}
  .opt.multi.selected .checkbox{border-color:var(--gold); background:var(--gold);}
  .opt.multi.selected .checkbox::after{content:''; position:absolute; left:3px; top:0px; width:5px; height:9px; border:solid #241d08; border-width:0 2px 2px 0; transform:rotate(45deg);}

  .fact-box{display:flex; gap:10px; align-items:flex-start; background:rgba(212,175,55,.08); border:1px solid rgba(212,175,55,.25); border-radius:14px; padding:12px 14px; margin-bottom:18px; font-size:12.5px; line-height:1.9; color:var(--cream-dim);}
  .fact-icon{flex-shrink:0; font-size:15px;}

  .rating-wrap{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .pill{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.16); cursor:pointer; font-size:14px; font-weight:700; color:var(--cream-dim); transition:all .2s;}
  .pill:hover{border-color:rgba(212,175,55,.4);}
  .pill.selected{background:linear-gradient(135deg, var(--gold), var(--gold-soft)); color:#241d08; border-color:var(--gold); transform:scale(1.08);}
  .rating-legend{display:flex; justify-content:space-between; font-size:11px; color:var(--cream-dim); margin-top:10px;}

  .risk-banner{display:flex; gap:12px; align-items:flex-start; text-align:right; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:14px 16px; margin-bottom:18px;}
  .risk-emoji{font-size:24px; line-height:1;}
  .risk-banner b{display:block; font-size:14px; color:var(--cream); margin-bottom:4px;}
  .risk-banner p{margin:0; font-size:12.5px; color:var(--cream-dim); line-height:1.8;}
  .risk-green{border-color:rgba(80,200,120,.4);}
  .risk-yellow{border-color:rgba(230,200,80,.4);}
  .risk-orange{border-color:rgba(230,150,70,.4);}
  .risk-red{border-color:rgba(220,90,70,.4);}

  .gift-card{background:rgba(255,255,255,.04); border:1px dashed rgba(255,255,255,.2); border-radius:16px; padding:16px 18px; margin-bottom:18px; text-align:right;}
  .gift-card h4{margin:0 0 6px; font-size:14.5px; color:var(--gold-soft);}
  .gift-list{margin:8px 0 0; padding-right:20px; font-size:12.5px; color:var(--cream); line-height:2;}

  .science-list{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
  .science-item{display:flex; gap:12px; align-items:flex-start; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:13px 15px;}
  .science-icon{color:var(--gold); font-size:12px; margin-top:5px; flex-shrink:0;}
  .science-item p{margin:0; font-size:13px; line-height:1.9; color:var(--cream);}
  .science-closing{background:linear-gradient(160deg, rgba(212,175,55,.14), rgba(255,255,255,.02)); border:1px solid rgba(212,175,55,.35); border-radius:14px; padding:14px 16px; margin-bottom:4px;}
  .science-closing p{margin:0; font-size:13px; line-height:1.9; color:var(--gold-soft); text-align:center;}

  input[type=text], input[type=tel], textarea{
    width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.16);
    border-radius:14px; padding:14px 16px; color:var(--cream); font-family:inherit; font-size:15px;
    outline:none; transition:border-color .2s, background .2s;
  }
  input::placeholder, textarea::placeholder{color:rgba(244,239,227,.4);}
  input:focus, textarea:focus{border-color:var(--gold); background:rgba(255,255,255,.08);}
  textarea{resize:vertical; min-height:88px; line-height:1.8;}

  .field-note{font-size:11.5px; color:var(--cream-dim); margin-top:8px;}

  .nav-row{display:flex; gap:10px; margin-top:26px;}
  .btn{
    border:none; border-radius:14px; padding:14px 20px; font-family:inherit; font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, opacity .2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{flex:1; background:linear-gradient(95deg, var(--gold), var(--gold-soft)); color:#241d08; box-shadow:0 10px 26px -8px rgba(212,175,55,.6);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{background:rgba(255,255,255,.06); color:var(--cream-dim); border:1px solid rgba(255,255,255,.14); flex:0 0 auto; width:52px;}
  .btn-ghost:hover{color:var(--cream);}

  /* welcome */
  .welcome-msg{background:rgba(255,255,255,.05); border-radius:16px; padding:16px 18px; margin:18px 0 22px; border-right:3px solid var(--gold);}
  .welcome-msg p{margin:0 0 10px; font-size:14px; line-height:2; color:var(--cream);}
  .welcome-msg p:last-child{margin-bottom:0;}
  .sig{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .sig-line{flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(212,175,55,.5));}
  .sig-name{font-size:13px; color:var(--gold-soft); font-weight:600; white-space:nowrap;}

  /* offer screen */
  .offer-wrap{text-align:center; position:relative;}
  .offer-badge{width:74px; height:74px; margin:0 auto 18px; border-radius:50%; background:radial-gradient(circle, var(--gold-soft), var(--gold)); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(212,175,55,.12), 0 20px 40px -10px rgba(212,175,55,.5); animation:pop .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{ from{transform:scale(0); opacity:0;} to{transform:scale(1); opacity:1;} }
  .offer-badge svg{width:34px; height:34px;}
  .offer-title{font-size:19px; font-weight:800; color:var(--cream); margin:0 0 6px;}
  .offer-name{font-size:13.5px; color:var(--cream-dim); margin:0 0 20px;}
  .offer-card{
    background:linear-gradient(160deg, rgba(212,175,55,.14), rgba(255,255,255,.03));
    border:1.5px solid rgba(212,175,55,.55);
    border-radius:18px; padding:24px 20px; margin-bottom:18px; text-align:right;
    box-shadow:0 0 40px -10px rgba(212,175,55,.35);
    position:relative; overflow:hidden;
  }
  .offer-card::before{content:'پیشنهاد اختصاصی شما'; position:absolute; top:0; left:0; background:var(--gold); color:#241d08; font-size:11px; font-weight:800; padding:5px 14px; border-radius:0 0 12px 0;}
  .offer-card h3{margin:20px 0 8px; font-size:17px; color:var(--gold-soft);}
  .offer-card p{margin:0; font-size:14px; line-height:2; color:var(--cream);}
  .offer-meta{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .chip{font-size:11.5px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); padding:5px 12px; border-radius:20px; color:var(--cream-dim);}
  .countdown-wrap{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:18px; padding-top:14px; border-top:1px dashed rgba(212,175,55,.35);}
  .countdown-label{font-size:12px; color:var(--cream-dim);}
  .countdown-timer{font-size:16px; font-weight:800; color:var(--gold-soft); letter-spacing:1px; direction:ltr; font-variant-numeric:tabular-nums;}
  .countdown-wrap.expired .countdown-timer{color:var(--danger);}

  .cta-stack{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .btn-whatsapp{background:#25D366; color:#08210f;}
  .btn-telegram{background:#2AABEE; color:#08202f;}
  .btn-outline{background:transparent; border:1px solid rgba(255,255,255,.2); color:var(--cream);}

  .dust{position:absolute; bottom:-10px; width:5px; height:5px; border-radius:50%; background:var(--gold-soft); opacity:0; pointer-events:none;}
  @keyframes rise{ 0%{transform:translateY(0); opacity:0;} 15%{opacity:.8;} 100%{transform:translateY(-260px); opacity:0;} }

  .foot-link{text-align:center; margin-top:26px;}
  .foot-link button{background:none; border:none; color:rgba(244,239,227,.35); font-size:11.5px; cursor:pointer; font-family:inherit; text-decoration:underline; text-underline-offset:3px;}

  /* admin */
  .admin-overlay{position:fixed; inset:0; background:rgba(10,18,15,.92); backdrop-filter:blur(6px); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto;}
  .admin-panel{width:100%; max-width:780px; background:linear-gradient(160deg, var(--navy-deep), var(--jade)); border:1px solid rgba(212,175,55,.3); border-radius:18px; padding:22px; margin-top:20px;}
  .admin-panel h2{margin:0 0 4px; font-size:18px; color:var(--gold-soft);}
  .admin-panel .sub2{font-size:12px; color:var(--cream-dim); margin-bottom:18px;}
  .admin-close{float:left; background:rgba(255,255,255,.08); border:none; color:var(--cream); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px;}
  .admin-stats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .stat{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 14px; font-size:12px; color:var(--cream-dim); min-width:110px; text-align:center;}
  .stat b{display:block; font-size:20px; color:var(--gold-soft); margin-bottom:2px;}
  .sub-row{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
  .sub-row-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;}
  .sub-row-top b{font-size:14.5px; color:var(--cream);}
  .sub-row-top span.date{font-size:11px; color:var(--cream-dim);}
  .sub-row .obstacle-tag{display:inline-block; font-size:11px; background:rgba(212,175,55,.15); color:var(--gold-soft); padding:3px 10px; border-radius:10px; margin-bottom:6px;}
  .sub-row .detail{font-size:12.5px; color:var(--cream-dim); line-height:1.8; margin:6px 0;}
  .sub-row .contact-btn{display:inline-flex; align-items:center; gap:6px; font-size:12px; background:#25D366; color:#08210f; padding:6px 12px; border-radius:10px; text-decoration:none; font-weight:700; margin-top:6px;}
  .admin-login{max-width:320px; margin:60px auto 0; text-align:center;}
  .admin-login input{margin-top:14px;}
  .admin-login button{margin-top:14px; width:100%;}
  .empty-state{text-align:center; padding:40px 10px; color:var(--cream-dim); font-size:13px;}

  ::selection{background:var(--gold); color:#241d08;}

  /* ---------- ATH Assessment Engine — luxury enhancements ---------- */
  .spotlight{position:absolute; top:-40px; left:50%; transform:translateX(-50%); width:340px; height:340px; background:radial-gradient(circle, rgba(212,175,55,.28), transparent 70%); filter:blur(10px); pointer-events:none; z-index:0;}
  .gold-foil{background:linear-gradient(100deg, #a9812c 0%, #f0d68c 25%, #d4af37 50%, #f7e6a8 65%, #a9812c 100%); background-size:220% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:foilShift 5s ease-in-out infinite;}
  @keyframes foilShift{ 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }

  .brand-eyebrow{text-align:center; font-size:11px; letter-spacing:2px; color:var(--gold-soft); text-transform:uppercase; margin-bottom:2px; opacity:.85;}

  /* checkbox-limit hint */
  .limit-note{font-size:11px; color:var(--cream-dim); text-align:center; margin-top:4px;}

  /* analyzing / transition screen */
  .analyzing-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 10px 30px; text-align:center;}
  .ring-orbit{position:relative; width:150px; height:150px; margin-bottom:26px;}
  .ring-orbit img{position:absolute; inset:0; margin:auto; width:88px; height:88px; object-fit:contain; filter:drop-shadow(0 10px 28px rgba(212,175,55,.55));}
  .ring{position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(212,175,55,.35); animation:ringPulse 2.2s ease-out infinite;}
  .ring.r2{animation-delay:.7s;}
  .ring.r3{animation-delay:1.4s;}
  @keyframes ringPulse{ 0%{transform:scale(.55); opacity:.9;} 100%{transform:scale(1.4); opacity:0;} }
  .analyzing-wrap h2{font-size:16px; color:var(--cream); margin:0 0 8px;}
  .analyzing-wrap p{font-size:12.5px; color:var(--cream-dim); margin:0;}

  /* result page */
  .profile-badge-row{display:flex; justify-content:center; margin-bottom:16px;}
  .profile-tag{font-size:11px; background:rgba(212,175,55,.14); border:1px solid rgba(212,175,55,.4); color:var(--gold-soft); padding:5px 16px; border-radius:20px; letter-spacing:.5px;}
  .result-title{font-size:20px; font-weight:800; text-align:center; margin:6px 0 14px; line-height:1.6;}
  .result-body{font-size:13.5px; line-height:2; color:var(--cream); text-align:center; margin-bottom:22px;}
  .priority-list{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
  .priority-item{display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px 16px;}
  .priority-num{width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg, var(--gold), var(--gold-soft)); color:#241d08; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .priority-item span:last-child{font-size:13.5px; color:var(--cream);}
  .disclaimer-note{font-size:11px; color:var(--cream-dim); text-align:center; line-height:1.9; border-top:1px dashed rgba(255,255,255,.15); padding-top:14px; margin-bottom:20px;}
  .barrier-card{background:linear-gradient(160deg, rgba(30,122,99,.16), rgba(255,255,255,.02)); border:1px solid rgba(30,122,99,.4); border-radius:16px; padding:16px 18px; margin-bottom:22px; text-align:center;}
  .barrier-card p{margin:0; font-size:13px; line-height:2; color:var(--cream);}
  .pathway-note{font-size:11.5px; color:var(--gold-soft); text-align:center; margin-top:10px; direction:rtl;}

  /* body-data / visual results / club intro */
  .gauge-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:18px;}
  .gauge-card{flex:1; min-width:130px; display:flex; flex-direction:column; align-items:center; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:16px 10px;}
  .gauge-wrap{position:relative; width:130px; height:130px;}
  .gauge-svg{width:130px; height:130px;}
  .gauge-svg circle{transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1);}
  .gauge-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-center b{font-size:19px; color:var(--cream); line-height:1.2;}
  .gauge-center span{font-size:10px; color:var(--cream-dim); letter-spacing:1px;}
  .gauge-info{text-align:center; margin-top:10px;}
  .gauge-cat{font-size:12px; font-weight:800; display:block; margin-bottom:6px;}
  .gauge-info p{font-size:11px; line-height:1.8; color:var(--cream-dim); margin:0;}

  .stat-mini-grid{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .stat-mini{flex:1; min-width:110px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 12px; text-align:center;}
  .stat-mini b{display:block; font-size:15px; color:var(--gold-soft);}
  .stat-mini span{font-size:10.5px; color:var(--cream-dim);}

  .club-intro-list{margin:0 0 16px; padding-right:20px; display:flex; flex-direction:column; gap:9px;}
  .club-intro-list li{font-size:13px; line-height:1.8; color:var(--cream);}
  .optin-row{display:flex; align-items:flex-start; gap:12px; background:rgba(212,175,55,.08); border:1px solid rgba(212,175,55,.3); border-radius:14px; padding:14px 16px; margin:16px 0 6px; cursor:pointer;}

// ---------- state ----------
const state = { stepIndex: 0, answers: {}, scores: { B:0,P:0,M:0,L:0,W:0 } };
const app = document.getElementById("app");

function personName(){ return (state.answers.name || "").trim().split(" ")[0] || ""; }
function totalSteps(){ return STEPS.length - 1; }
function progressPercent(){ return Math.min(100, Math.round((state.stepIndex / totalSteps()) * 100)); }

function render(){
  const step = STEPS[state.stepIndex];
  const pct = progressPercent();
  updateBrandGlow(pct);
  const isWelcome = step.type === "welcome";
  const hideProgress = step.type === "analyzing" || step.type === "result";

  app.innerHTML = `
    <div class="brandbar ${isWelcome?'hero':''}" style="position:relative;">
      ${isWelcome? '<div class="spotlight"></div>':''}
      <img id="logoImg" src="${window.LOGO_SRC}" alt="آرم اندیشه طلوع حرکت" style="position:relative; z-index:1;">
    </div>
    <div class="brand-eyebrow">ATH Wellness &amp; Movement Assessment</div>
    <div class="brand-text"><b>باشگاه تندرستی و مشاوره ورزشی اندیشه طلوع حرکت</b></div>
    ${hideProgress ? "" : `
    <div class="progress-wrap">
      <div class="progress-label"><span>مسیر ارزیابی شما</span><span>${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`}
    <div class="stage"><div class="card" id="card">${renderStep(step)}</div></div>
  `;
  bindStepEvents(step);
  if (step.type === "analyzing") runAnalyzing();
}

function renderStep(step){
  if (step.type === "welcome") return renderWelcome();
  if (step.type === "single") return renderSingle(step);
  if (step.type === "multi") return renderMulti(step);
  if (step.type === "rating") return renderRating(step);
  if (step.type === "bodyData") return renderBodyData();
  if (step.type === "visualResults") return renderVisualResults();
  if (step.type === "analyzing") return renderAnalyzing();
  if (step.type === "result") return renderResult();
  if (step.type === "clubIntro") return renderClubIntro();
  if (step.type === "personalInfo") return renderPersonalInfo(step);
  return "";
}

function renderResult(){

  const sev = severityLabel(state.answers.impact ?? 5);

  const titleHtml = tie
    ? `مسیر شما ترکیبی است: <span class="gold-foil">${p1.title}</span> + <span class="gold-foil">${p2.title}</span>`
    : `اولویت فعلی شما: <span class="gold-foil">${p1.title}</span>`;

  const bodyText = tie
    ? `${p1.body} همچنین، ${p2.body}`

  const priorities = tie
    ? Array.from(new Set([...p1.priorities.slice(0,2), ...p2.priorities.slice(0,1)])).slice(0,3)

  const priorityHtml = priorities.map((pr,i)=>`

  return `

function computeBMI(){
  const h = parseFloat(state.answers.height);
  const w = parseFloat(state.answers.weight);
  if (!h || !w) return null;
  const m = h/100;
  return w/(m*m);
}
function bmiCategory(bmi){
  if (bmi < 18.5) return { label:"کم‌وزن", color:"#6fa8dc" };
  if (bmi < 25) return { label:"طبیعی", color:"#4caf6d" };
  if (bmi < 30) return { label:"اضافه‌وزن", color:"#e0a83e" };
  return { label:"بالاتر از محدوده طبیعی", color:"#d9714e" };
}
function computeWHR(){
  const waist = parseFloat(state.answers.waist);
  const hip = parseFloat(state.answers.hip);
  if (!waist || !hip) return null;
  return waist/hip;
}
function whrCategory(whr){
  if (whr < 0.85) return { label:"مطلوب", color:"#4caf6d" };
  if (whr < 0.95) return { label:"متوسط", color:"#e0a83e" };
  return { label:"نیازمند توجه بیشتر", color:"#d9714e" };
}
function gaugeSVG(percent, color){
  const r = 54, c = 2*Math.PI*r;
  const clamped = Math.max(2, Math.min(100, percent));
  const offset = c * (1 - clamped/100);
  return `<svg viewBox="0 0 130 130" class="gauge-svg">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 65 65)"/>
  </svg>`;
}

function renderVisualResults(){
  const bmi = computeBMI();
  const whr = computeWHR();
  let gaugesHtml = "";
  if (bmi){
    const cat = bmiCategory(bmi);
    const pct = ((bmi-15)/(35-15))*100;
    gaugesHtml += `<div class="gauge-card">
      <div class="gauge-wrap">${gaugeSVG(pct, cat.color)}<div class="gauge-center"><b>${bmi.toFixed(1)}</b><span>BMI</span></div></div>
      <div class="gauge-info"><span class="gauge-cat" style="color:${cat.color}">${cat.label}</span>
      <p>شاخص توده بدنی، برآوردی کلی از نسبت وزن به قد است و به‌تنهایی تصویر کامل ترکیب بدن را نشان نمی‌دهد.</p></div>
    </div>`;
  }
  if (whr){
    const cat = whrCategory(whr);
    const pct = ((whr-0.7)/(1.1-0.7))*100;
    gaugesHtml += `<div class="gauge-card">
      <div class="gauge-wrap">${gaugeSVG(pct, cat.color)}<div class="gauge-center"><b>${whr.toFixed(2)}</b><span>WHR</span></div></div>
      <div class="gauge-info"><span class="gauge-cat" style="color:${cat.color}">${cat.label}</span>
      <p>نسبت دور کمر به باسن، شاخصی از الگوی توزیع چربی بدن است که در مطالعات سلامت کاربرد دارد.</p></div>
    </div>`;
  }
  const hasData = !!(bmi || whr);
  const abdomenNote = state.answers.abdomen ? `<div class="stat-mini"><b>${escapeHtml(state.answers.abdomen)} سانتی‌متر</b><span>دور شکم</span></div>` : "";
  const wellnessCards = `
    <div class="stat-mini-grid">
      ${state.answers.energyLevel!==undefined?`<div class="stat-mini"><b>${state.answers.energyLevel}/10</b><span>سطح انرژی روزانه</span></div>`:""}
      ${state.answers.activityDays?`<div class="stat-mini"><b>${escapeHtml(state.answers.activityDays)}</b><span>فعالیت هفتگی</span></div>`:""}
      ${state.answers.sleepQuality?`<div class="stat-mini"><b>${escapeHtml(state.answers.sleepQuality)}</b><span>کیفیت خواب</span></div>`:""}
      ${state.answers.dailyCapacity!==undefined?`<div class="stat-mini"><b>${state.answers.dailyCapacity}/10</b><span>توان کارهای روزمره</span></div>`:""}
      ${abdomenNote}
    </div>`;
  const generalFacts = !hasData ? `<div class="science-list">${GENERAL_FACTS.map(f=>`<div class="science-item"><span class="science-icon">◆</span><p>${f}</p></div>`).join("")}</div>` : "";

  return `
    <span class="eyebrow">تصویری از وضعیت امروز شما</span>
    <h1 class="q">${personName()?`${personName()} عزیز، `:""}این خلاصه‌ای از پاسخ‌های شماست</h1>
    ${hasData ? `<div class="gauge-row">${gaugesHtml}</div>` : `<p class="sub">این نکات کلی، مستقل از اعداد شخصی، همچنان برایتان مفید است:</p>`}
    ${wellnessCards}
    ${generalFacts}
    <p class="disclaimer-note" style="margin-top:4px;">این اطلاعات جنبه آموزشی دارند و جایگزین ارزیابی تخصصی حضوری نیستند.</p>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goBack()">‹</button>
      <button class="btn btn-primary" onclick="goNext()">ادامه</button>
    </div>
  `;
}

function renderClubIntro(){
  return `
    <span class="eyebrow">درباره ما</span>
    <h1 class="q">باشگاه تندرستی و مشاوره ورزشی اندیشه طلوع حرکت</h1>
    <p class="sub" style="line-height:2;">«اندیشه طلوع حرکت» با بیش از ۱۲ سال تجربه میدانی و هزاران ارزیابی حرکتی و فیزیولوژیک، یک باشگاه تندرستی و مشاوره ورزشی است — نه یک باشگاه بدنسازی معمولی. امکانات و خدمات ما شامل:</p>
    <ul class="club-intro-list">${CLUB_SERVICES.map(s=>`<li>${s}</li>`).join("")}</ul>
    <p class="sub" style="line-height:2; margin-top:6px;">مسیر ما بر پایه علم و دانش روز، ظرفیت‌سازی و سازگاری حرکتی با طراحی برنامه‌های اختصاصی، با هدف رساندن شما به بهترین و ایده‌آل‌ترین شرایط شما بنا شده است.</p>
    <div class="optin-row" id="optinRow">
      <span class="checkbox-lg ${state.answers.wantsContact?'checked':''}" id="optinCheckbox"></span>
      <span>مایلم تیم اندیشه طلوع حرکت با من تماس بگیرد و از خدمات این باشگاه استفاده کنم</span>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goBack()">‹</button>
      <button class="btn btn-primary" onclick="goNext()">ادامه</button>
    </div>
  `;
}

function bindStepEvents(step){
  if (step.type === "welcome"){
    const inp = document.getElementById("nameInput");
    inp.addEventListener("input", e => { state.answers.name = e.target.value; });
    inp.addEventListener("keydown", e => { if(e.key==="Enter") goNext(); });
  }
  if (step.type === "single"){
    document.querySelectorAll("#optWrap .opt").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.answers[step.key] = el.getAttribute("data-v");
        document.querySelectorAll("#optWrap .opt").forEach(o=>o.classList.remove("selected"));
        el.classList.add("selected");
        document.getElementById("nextBtn").disabled = false;
      });
    });
  }
  if (step.type === "multi"){
    if (!state.answers[step.key]) state.answers[step.key] = [];
    document.querySelectorAll("#optWrap .opt").forEach(el=>{
      el.addEventListener("click", ()=>{
        const v = el.getAttribute("data-v");
        const arr = state.answers[step.key];
        const idx = arr.indexOf(v);
        if (idx === -1){
          if (step.maxSelect && arr.length >= step.maxSelect){
            const first = arr.shift();
            document.querySelector(`#optWrap .opt[data-v="${first}"]`)?.classList.remove("selected");
          }
          arr.push(v); el.classList.add("selected");
        } else { arr.splice(idx,1); el.classList.remove("selected"); }
      });
    });
  }
  if (step.type === "rating"){
    document.querySelectorAll("#optWrap .pill").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.answers[step.key] = parseInt(el.getAttribute("data-v"),10);
        document.querySelectorAll("#optWrap .pill").forEach(o=>o.classList.remove("selected"));
        el.classList.add("selected");
        document.getElementById("nextBtn").disabled = false;
      });
    });
  }
  if (step.type === "personalInfo"){
    document.getElementById("fullNameInput").addEventListener("input", e=>{ state.answers.fullName = e.target.value; });
    document.getElementById("phoneInput").addEventListener("input", e=>{ state.answers.phone = e.target.value; });
  }
  if (step.type === "bodyData"){
    ["height","weight","waist","abdomen","hip"].forEach(f=>{
      document.getElementById(f+"Input").addEventListener("input", e=>{ state.answers[f] = e.target.value; });
    });
  }
  if (step.type === "clubIntro"){
    document.getElementById("optinRow").addEventListener("click", ()=>{
      state.answers.wantsContact = !state.answers.wantsContact;
      document.getElementById("optinCheckbox").classList.toggle("checked", !!state.answers.wantsContact);
    });
  }
}

function validatePersonalInfo(){
  let ok = true;
  if (!state.answers.fullName){ shake("fullNameInput"); ok = false; }
  if (!state.answers.phone){ shake("phoneInput"); ok = false; }
  if (!ok) return;
  goNext();
}

function goNext(){
  const step = STEPS[state.stepIndex];
  if (step.type === "welcome" && !state.answers.name){ shake("nameInput"); return; }
  if (step.type === "analyzing") return; // auto-advances
  if (state.stepIndex < STEPS.length - 1){
    state.stepIndex++;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    submitForm();
  }
}
function goBack(){
  if (state.stepIndex <= 0) return;
  state.stepIndex--;
  while (state.stepIndex > 0 && (STEPS[state.stepIndex].type === "analyzing" || STEPS[state.stepIndex].type === "result")){
    state.stepIndex--;
  }
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function shake(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.borderColor = "var(--danger)";
  el.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}], {duration:300});
  setTimeout(()=>{ el.style.borderColor=""; }, 900);
}

function updateBrandGlow(pct){
  const img = document.getElementById("logoImg");
  if (!img) return;
  const glow = 0.35 + (pct/100)*0.35;
  img.style.filter = `drop-shadow(0 8px ${18 + pct/100*14}px rgba(212,175,55,${glow}))`;
  img.style.transform = pct >= 100 ? "scale(1.06)" : "scale(1)";
}

// ---------- موتور امتیازدهی ----------
function computeScores(){
  const s = { B:0,P:0,M:0,L:0,W:0 };
  const a = state.answers;

  // Q2 experience (+3/+4 each, up to 2 selections)
  const expMap = { energy:["L",3], capacity:["P",3], mobility:["M",3], pain:["M",4], body:["B",4], posture:["M",3], sleep:["L",3], none:["W",4] };
  (a.experience||[]).forEach(v=>{ const m=expMap[v]; if(m) s[m[0]]+=m[1]; });

  // Q4 goal (+5/+6)
  const goalMap = { body_comp:["B",6], capacity:["P",6], movement_quality:["M",6], posture:["M",6], energy:["L",6], sleep:["L",6], habits:["L",5], prevention:["W",6] };
  if (a.goal && goalMap[a.goal]) { const m=goalMap[a.goal]; s[m[0]]+=m[1]; }

  // Q5 gap multiplier — applied to scores accumulated so far (Q2+Q4)
  const gapMult = { very_low:0.5, low:0.75, notable:1, high:1.25, unknown:0.85 };
  const mult = gapMult[a.gap] ?? 1;
  Object.keys(s).forEach(k => s[k] = s[k] * mult);

  // Q6 importance (some dual-scored)
  const impMap = {
    energy: [["P",2],["L",2]],
    movement_quality: [["M",3]],
    body_comp: [["B",3]],
    future_decline: [["W",3]],
    independence: [["W",3],["P",2]],
    habits: [["L",3]],
    none: [["W",2]],
  };
  if (a.importance && impMap[a.importance]) impMap[a.importance].forEach(([k,v])=> s[k]+=v);

  // Q8 desired outcome (multi, +5 each)
  const outMap = { body_comp:["B",5], capacity:["P",5], movement_quality:["M",5], posture:["M",5], energy:["L",5], sleep:["L",5], habits:["L",5] };
  (a.desiredOutcome||[]).forEach(v=>{ const m=outMap[v]; if(m) s[m[0]]+=m[1]; });

  // Q9 single most important outcome (+8, direct profile mapping)
  if (a.singleOutcome && s.hasOwnProperty(a.singleOutcome)) s[a.singleOutcome] += 8;

  state.scores = s;
}

function getPrimaryProfiles(){
  const s = state.scores;
  const sorted = Object.entries(s).sort((x,y)=>y[1]-x[1]);
  const primary = sorted[0][0];
  const secondary = sorted[1][0];
  const diff = sorted[0][1] - sorted[1][1];
  return { primary, secondary, tie: diff < 5 };
}

function computeLeadScore(){
  const severity = state.answers.impact ?? 5;
  const readiness = state.answers.readiness ?? 5;
  let score = (severity * 4) + (readiness * 4) + 10;
  return Math.max(0, Math.min(100, Math.round(score)));
}

// ---------- ثبت نهایی و آفر ----------
async function submitForm(){
  const record = { ...state.answers, timestamp: new Date().toISOString() };
  const { primary, secondary, tie } = getPrimaryProfiles();
  record.primaryProfile = primary;
  record.secondaryProfile = secondary;
  record.tie = tie;
  record.leadScoreValue = computeLeadScore();
  record.leadBucket = leadBucket(record.leadScoreValue);
  record.readinessBucket = readinessBucket(state.answers.readiness ?? 5);

  sendSubmissionByEmail(record);
  renderOffer(record);
}

function renderOffer(record){
  const p1 = PROFILES[record.primaryProfile];
  const p2 = record.secondaryProfile ? PROFILES[record.secondaryProfile] : null;
  const offerText = record.tie && p2 ? `${p1.offer} + ${p2.offer}` : p1.offer;
  updateBrandGlow(100);
  const waText = buildSummaryText(record);
  const waLink = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(waText)}`;
  const tgLink = `https://t.me/${CONFIG.telegramUsername}`;
  const expiresAt = Date.now() + CONFIG.offerValidityHours * 3600 * 1000;

  app.innerHTML = `
    <div class="brandbar"><img id="logoImg" src="${window.LOGO_SRC}" alt="آرم اندیشه طلوع حرکت"></div>
    <div class="brand-eyebrow">ATH Wellness &amp; Movement Assessment</div>
    <div class="brand-text"><b>باشگاه تندرستی و مشاوره ورزشی اندیشه طلوع حرکت</b></div>
    <div class="stage">
      <div class="card offer-wrap" id="offerCard">
        <div class="offer-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#241d08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <p class="offer-title">ممنون، ${personName()||"همراه عزیز"}! پیشنهاد اختصاصی شما آماده است 🌿</p>
        <p class="offer-name">بر اساس پروفایل شما، این مسیر را پیشنهاد می‌کنیم:</p>
        <div class="offer-card">
          <h3>${offerText}</h3>
          <p class="pathway-note">${p1.pathway}</p>
          <div class="countdown-wrap">
            <span class="countdown-label">اعتبار این پیشنهاد:</span>
            <span class="countdown-timer" id="countdownTimer">--:--:--</span>
          </div>
        </div>
        <div class="cta-stack">
          <a class="btn btn-whatsapp" href="${waLink}" target="_blank" rel="noopener">ارسال به واتساپ باشگاه</a>
          <a class="btn btn-telegram" href="${tgLink}" target="_blank" rel="noopener">گفتگو در تلگرام</a>
          <button class="btn btn-outline" onclick="copySummary(this)">کپی خلاصه گفتگو</button>
        </div>
        <p class="field-note" style="margin-top:16px;">تیم ما در بازه «${record.bestTime||"زمان مناسب شما"}» با شما تماس خواهد گرفت.</p>
      </div>
    </div>
  `;
  spawnDust();
  startCountdown(expiresAt);
}

function startCountdown(expiresAt){
  function tick(){
    const target = document.getElementById("countdownTimer");
    if (!target) return;
    const remaining = expiresAt - Date.now();
    if (remaining <= 0){ target.textContent = "منقضی شده"; target.parentElement.classList.add("expired"); return; }
    const h = Math.floor(remaining / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    target.textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    setTimeout(tick, 1000);
  }
  tick();
}

function buildSummaryText(r){
  const p1 = PROFILES[r.primaryProfile];
  const barrier = BARRIERS[r.barrier] || {};
  return [
    `سلام، من ${r.fullName||r.name} هستم.`,
    `پروفایل اصلی: ${p1.title}`,
    `مانع اصلی: ${barrier.label||"-"}`,
    `بهترین زمان تماس: ${r.bestTime||"-"}`,
    `شماره تماس: ${r.phone||"-"}`,
  ].filter(Boolean).join("\n");
}

function copySummary(btn){
  const { primary, secondary, tie } = getPrimaryProfiles();
  const record = { ...state.answers, primaryProfile: primary, secondaryProfile: secondary, tie };
  const text = buildSummaryText(record);
  navigator.clipboard.writeText(text).then(()=>{
    const old = btn.textContent;
    btn.textContent = "کپی شد ✓";
    setTimeout(()=>{ btn.textContent = old; }, 1800);
  }).catch(()=>{});
}

function spawnDust(){
  const card = document.getElementById("offerCard");
  if (!card) return;
  for (let i=0;i<18;i++){
    const d = document.createElement("div");
    d.className = "dust";
    d.style.left = (10 + Math.random()*80) + "%";
    d.style.animation = `rise ${2.5+Math.random()*2}s ease-out ${Math.random()*1.2}s forwards`;
    card.appendChild(d);
  }
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function sendSubmissionByEmail(record){
  const p1 = PROFILES[record.primaryProfile];
  const p2 = record.secondaryProfile ? PROFILES[record.secondaryProfile] : null;
  const barrier = BARRIERS[record.barrier] || {};
  const bmi = computeBMI();
  const whr = computeWHR();
  const payload = {
    _subject: `سرنخ جدید ATH Assessment — ${record.fullName || record.name || "بدون‌نام"} [${record.leadBucket}]${record.wantsContact?" ★ درخواست تماس":""}`,
    "نام": record.fullName || record.name || "-",
    "شماره تماس": record.phone || "-",
    "درخواست صریح تماس از باشگاه": record.wantsContact ? "بله" : "خیر / مشخص نکرده",
    "پروفایل اصلی": `${record.primaryProfile} — ${p1.title}`,
    "پروفایل ثانویه": record.tie && p2 ? `${record.secondaryProfile} — ${p2.title}` : "-",
    "امتیازهای خام (B/P/M/L/W)": `B:${state.scores.B.toFixed(1)} P:${state.scores.P.toFixed(1)} M:${state.scores.M.toFixed(1)} L:${state.scores.L.toFixed(1)} W:${state.scores.W.toFixed(1)}`,
    "مانع اصلی": barrier.label || "-",
    "شدت نیاز (Q7)": `${record.impact ?? "-"} — ${severityLabel(record.impact ?? 5)}`,
    "آمادگی (Q13)": `${record.readiness ?? "-"} — ${record.readinessBucket}`,
    "Lead Score (داخلی، فقط برای تیم فروش)": `${record.leadScoreValue} — ${record.leadBucket}`,
    "قد/وزن": `${record.height||"-"} سانتی‌متر / ${record.weight||"-"} کیلوگرم`,
    "BMI": bmi ? `${bmi.toFixed(1)} — ${bmiCategory(bmi).label}` : "-",
    "دور کمر/شکم/باسن": `${record.waist||"-"} / ${record.abdomen||"-"} / ${record.hip||"-"} سانتی‌متر`,
    "WHR": whr ? `${whr.toFixed(2)} — ${whrCategory(whr).label}` : "-",
    "سطح انرژی روزانه": record.energyLevel ?? "-",
    "فعالیت هفتگی": record.activityDays || "-",
    "کیفیت خواب": record.sleepQuality || "-",
    "توان کارهای روزمره": record.dailyCapacity ?? "-",
    "بهترین زمان تماس": record.bestTime || "-",
    "زمان ثبت": new Date(record.timestamp).toLocaleString("fa-IR"),
    _template: "table",
  };
  try{
    await fetch(`https://formsubmit.co/ajax/${CONFIG.notifyEmail}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload),
    });
  }catch(err){
    console.error("ارسال ایمیل نتیجه فرم ناموفق بود:", err);
  }
}

function initParticles(){
  const wrap = document.getElementById("particles");
  for (let i=0;i<14;i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random()*100+"vw";
    p.style.top = Math.random()*100+"vh";
    p.style.animation = `drift ${16+Math.random()*10}s ease-in-out infinite`;
    p.style.animationDelay = (Math.random()*6)+"s";
    wrap.appendChild(p);
  }
}

initParticles();
render();

</script>
